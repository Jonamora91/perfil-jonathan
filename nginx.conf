server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

    # Machine-readable resume — CORS open so MCPs / tools can fetch it from anywhere
    location = /cv.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /cv.json =404;
    }

    location = /sitemap.xml { try_files /sitemap.xml =404; }
    location = /robots.txt  { try_files /robots.txt  =404; }

    # long-cache immutable-ish assets
    location ~* \.(svg|css|js|png|jpe?g|gif|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # HTML: serve /, /en/, and pretty paths. Short cache so edits propagate.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
